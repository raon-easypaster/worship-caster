<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>예배송출 화면</title>
<link rel="stylesheet" href="/render.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: none; }
  body.overlay { background: transparent !important; }
  body.overlay .wc-screen { background: transparent; }
  body { display: flex; align-items: center; justify-content: center; }
  #screen { width: min(100vw, calc(100vh * 16 / 9)); }
  #hint { position: fixed; left: 12px; bottom: 12px; color: #888; font: 13px sans-serif; background: rgba(0,0,0,.6); padding: 6px 10px; border-radius: 6px; transition: opacity .6s; z-index: 9; }
  #offline { position: fixed; right: 10px; top: 10px; width: 10px; height: 10px; border-radius: 50%; background: #e33; display: none; z-index: 9; }
</style>
</head>
<body>
<div id="screen" class="wc-screen"></div>
<div id="hint">F 키 또는 더블클릭 = 전체화면</div>
<div id="offline" title="서버 연결 끊김 — 재연결 중"></div>
<script src="/render.js"></script>
<script>
  const mode = { '/output': 'main', '/overlay': 'overlay', '/stage': 'stage' }[location.pathname] || 'main';
  if (mode === 'overlay') document.body.classList.add('overlay');
  if (mode === 'overlay' || new URLSearchParams(location.search).has('nohint')) document.getElementById('hint').remove();
  else setTimeout(() => document.getElementById('hint')?.style.setProperty('opacity', 0), 5000);
  document.title = { main: '예배당 화면', overlay: '방송 자막(OBS)', stage: '프롬프터' }[mode];

  const screen = document.getElementById('screen');
  let snap = null;
  function connect() {
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onopen = () => { document.getElementById('offline').style.display = 'none'; wsNow = ws; reportOBS(); };
    ws.onmessage = e => { const m = JSON.parse(e.data); if (m.type === 'live') { snap = m; WC.render(screen, snap, mode); syncScene(); } };
    ws.onclose = () => { document.getElementById('offline').style.display = 'block'; setTimeout(connect, 1000); };
  }
  // ── OBS 장면 자동 전환 (방송 자막 화면에서만) ──────────────
  // 그림·악보·PPT를 방송에 보낼 때 '사람 화면 장면'으로, 끝나면 '평소 장면'으로.
  // OBS 브라우저 소스의 페이지 권한이 '고급 접근 권한'(4 이상)일 때만 동작
  let wsNow = null, obsLevel = -1, obsScenes = [];
  const obs = mode === 'overlay' ? window.obsstudio : null;
  function reportOBS() {
    if (!obs || !wsNow || wsNow.readyState !== 1) return;
    wsNow.send(JSON.stringify({ type: 'obsStatus', level: obsLevel, scenes: obsScenes }));
  }
  if (obs) {
    if (obs.getControlLevel) obs.getControlLevel(l => {
      obsLevel = l; reportOBS();
      if (l >= 2 && obs.getScenes) obs.getScenes(list => { obsScenes = (list || []).map(x => typeof x === 'string' ? x : x?.name).filter(Boolean); reportOBS(); });
    });
    else { obsLevel = -2; }
  }
  function syncScene() {
    if (!obs || obsLevel < 4 || !snap?.obs) return;
    const { base, pip } = snap.obs;
    if (!base || !pip) return;
    const want = WC.bcMode(snap) === 'full' && snap.live.pip ? pip : base;
    obs.getCurrentScene(cur => {
      const name = cur?.name;
      if ((name === base || name === pip) && name !== want) obs.setCurrentScene(want);  // 다른 장면(설교 전용 등)에 있을 땐 건드리지 않음
    });
  }
  connect();
  if (mode === 'stage') setInterval(() => snap && WC.render(screen, snap, mode, { fade: false }), 15000);

  const fs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') fs(); });
  addEventListener('dblclick', fs);
</script>
</body>
</html>
