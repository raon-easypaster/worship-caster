<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>예배송출 화면</title>
<link rel="stylesheet" href="/render.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: none; }
  body.overlay { background: transparent !important; }
  body.overlay .wc-screen { background: transparent; }
  body { display: flex; align-items: center; justify-content: center; }
  #screen { width: min(100vw, calc(100vh * 16 / 9)); }
  #hint { position: fixed; left: 12px; bottom: 12px; color: #888; font: 13px sans-serif; background: rgba(0,0,0,.6); padding: 6px 10px; border-radius: 6px; transition: opacity .6s; z-index: 9; }
  #offline { position: fixed; right: 10px; top: 10px; width: 10px; height: 10px; border-radius: 50%; background: #e33; display: none; z-index: 9; }
</style>
</head>
<body>
<div id="screen" class="wc-screen"></div>
<div id="hint">F 키 또는 더블클릭 = 전체화면</div>
<div id="offline" title="서버 연결 끊김 — 재연결 중"></div>
<script src="/render.js"></script>
<script>
  const mode = { '/output': 'main', '/overlay': 'overlay', '/stage': 'stage' }[location.pathname] || 'main';
  if (mode === 'overlay') document.body.classList.add('overlay');
  if (mode === 'overlay' || new URLSearchParams(location.search).has('nohint')) document.getElementById('hint').remove();
  else setTimeout(() => document.getElementById('hint')?.style.setProperty('opacity', 0), 5000);
  document.title = { main: '예배당 화면', overlay: '방송 자막(OBS)', stage: '프롬프터' }[mode];

  const screen = document.getElementById('screen');
  let snap = null;
  function connect() {
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onopen = () => (document.getElementById('offline').style.display = 'none');
    ws.onmessage = e => { const m = JSON.parse(e.data); if (m.type === 'live') { snap = m; WC.render(screen, snap, mode); } };
    ws.onclose = () => { document.getElementById('offline').style.display = 'block'; setTimeout(connect, 1000); };
  }
  connect();
  if (mode === 'stage') setInterval(() => snap && WC.render(screen, snap, mode, { fade: false }), 15000);

  const fs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') fs(); });
  addEventListener('dblclick', fs);
</script>
</body>
</html>
