<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>예배송출 화면</title>
<link rel="stylesheet" href="/render.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: none; }
  body.overlay { background: transparent !important; }
  body.overlay .wc-screen { background: transparent; }
  body { display: flex; align-items: center; justify-content: center; }
  #screen { width: min(100vw, calc(100vh * 16 / 9)); }
  #screen[data-ar="43"] { width: min(100vw, calc(100vh * 4 / 3)); }
  #hint.big { left: 50%; top: 50%; bottom: auto; transform: translate(-50%, -50%); color: #fff; font: 600 28px sans-serif; padding: 22px 34px; border-radius: 14px; background: rgba(20,30,50,.85); border: 2px solid #6aa8ff; text-align: center; }
  #hint { position: fixed; left: 12px; bottom: 12px; color: #888; font: 13px sans-serif; background: rgba(0,0,0,.6); padding: 6px 10px; border-radius: 6px; transition: opacity .6s; z-index: 9; }
  #offline { position: fixed; right: 10px; top: 10px; width: 10px; height: 10px; border-radius: 50%; background: #e33; display: none; z-index: 9; }
</style>
</head>
<body>
<div id="screen" class="wc-screen"></div>
<div id="hint">F 키 또는 더블클릭 = 전체화면</div>
<div id="offline" title="서버 연결 끊김 — 재연결 중"></div>
<script src="/i18n.js"></script>
<script src="/render.js"></script>
<script>
  const mode = { '/output': 'main', '/overlay': 'overlay', '/stage': 'stage' }[location.pathname] || 'main';
  if (mode === 'overlay') {
    document.body.classList.add('overlay');
    document.documentElement.style.background = 'transparent';   // html 바탕이 검게 남아 OBS에서 투명하지 않던 문제 (smdjoo-stack 님 수정)
  }
  // 운영 화면에서 모니터를 골라 연 창(?fs=1): 전체화면이 아니면 크게 안내하고, 아무 곳이나 한 번 누르면 전체화면
  // (브라우저는 사람이 그 창을 누르기 전에는 전체화면을 막음. 전체화면 창 열기를 지원하는 브라우저는 처음부터 전체화면)
  const wantFs = mode !== 'overlay' && new URLSearchParams(location.search).has('fs');
  if (mode === 'overlay' || new URLSearchParams(location.search).has('nohint')) document.getElementById('hint').remove();
  else if (wantFs && !document.fullscreenElement) {
    const h = document.getElementById('hint');
    const t = s => (window.I18N ? I18N.t(s) : s);
    h.classList.add('big'); h.innerHTML = t('화면을 한 번 누르면 전체화면') + '<br><small style="font-weight:400;font-size:17px;opacity:.8">' + t('F 키도 됩니다') + '</small>';
    const hide = () => { if (document.fullscreenElement) h.style.opacity = 0; };
    document.addEventListener('fullscreenchange', hide);
    setTimeout(hide, 300);
    setTimeout(() => (h.style.opacity = 0), 15000);
    addEventListener('click', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); });
  }
  else setTimeout(() => document.getElementById('hint')?.style.setProperty('opacity', 0), 5000);
  document.title = { main: '예배당 화면', overlay: '방송 자막(OBS)', stage: '프롬프터' }[mode];

  const screen = document.getElementById('screen');
  window.WC_YT_PLAYER = true;   // 유튜브 영상을 실제로 틀어 줌 (운영 화면 미리보기는 그림만)
  window.WC_report = msg => { try { if (wsNow?.readyState === 1) wsNow.send(JSON.stringify(msg)); } catch {} };
  let snap = null;
  function connect() {
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onopen = () => {
      document.getElementById('offline').style.display = 'none'; wsNow = ws; reportOBS();
      // 예배송출이 다시 켜졌으면(업데이트·재시작) 새 화면 코드를 받도록 새로고침
      fetch('/api/boot', { cache: 'no-store' }).then(r => r.json()).then(({ boot, lang }) => {
        if (lang !== I18N.lang) { I18N.setLang(lang); if (snap) WC.render(screen, snap, mode, { fade: false }); }
        if (window._wcBoot && window._wcBoot !== boot) location.reload();
        window._wcBoot = boot;
      }).catch(() => {});
    };
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.type === 'live') { m._off = m.now - Date.now(); snap = m; WC.render(screen, snap, mode, { audio: location.pathname === '/output' }); syncScene(); checkSound(); }
      // 예배송출을 끄면 예배당 화면·프롬프터 창도 닫힘 (OBS 자막은 OBS 안이라 화면만 비움)
      if (m.type === 'lang' && m.lang !== I18N.lang) return location.reload();
      if (m.type === 'quit') {
        window._wcQuit = true;
        screen.innerHTML = '';
        if (mode !== 'overlay') {
          window.close();
          setTimeout(() => { document.body.innerHTML = '<div style="color:#666;font:16px sans-serif;margin:auto">예배송출이 종료되었습니다. 이 창은 닫으셔도 됩니다.</div>'; }, 400);
        }
      }
    };
    ws.onclose = () => { if (window._wcQuit) return; document.getElementById('offline').style.display = 'block'; setTimeout(connect, 1000); };
  }
  // ── OBS 장면 자동 전환 (방송 자막 화면에서만) ──────────────
  // 그림·악보·PPT를 방송에 보낼 때 '사람 화면 장면'으로, 끝나면 '평소 장면'으로.
  // OBS 브라우저 소스의 페이지 권한이 '고급 접근 권한'(4 이상)일 때만 동작
  let wsNow = null, obsLevel = -1, obsScenes = [];
  const obs = mode === 'overlay' ? window.obsstudio : null;
  function reportOBS() {
    if (!obs || !wsNow || wsNow.readyState !== 1) return;
    wsNow.send(JSON.stringify({ type: 'obsStatus', level: obsLevel, scenes: obsScenes }));
  }
  if (obs) {
    if (obs.getControlLevel) obs.getControlLevel(l => {
      obsLevel = l; reportOBS();
      if (l >= 2 && obs.getScenes) obs.getScenes(list => { obsScenes = (list || []).map(x => typeof x === 'string' ? x : x?.name).filter(Boolean); reportOBS(); });
    });
    else { obsLevel = -2; }
  }
  function syncScene() {
    if (!obs || obsLevel < 4 || !snap?.obs) return;
    const { base, pip, circle } = snap.obs;
    if (!base || !(pip || circle)) return;
    const img = snap.item?.bcFull ? 'full' : snap.style?.overlay?.imgMode;
    const full = WC.bcMode(snap) === 'full';
    // '화면 일부'는 OBS 장면 전환 없이 카메라가 보임 · '사람 원'은 원 장면(카메라를 원 자리에 작게 놓은 장면)으로
    const want = full && img === 'circle' && circle ? circle : full && snap.live.pip && pip && img !== 'part' && img !== 'circle' ? pip : base;
    obs.getCurrentScene(cur => {
      const name = cur?.name;
      if ((name === base || name === pip || name === circle) && name !== want) obs.setCurrentScene(want);  // 다른 장면(설교 전용 등)에 있을 땐 건드리지 않음
    });
  }
  connect();
  if (mode === 'stage') setInterval(() => snap && WC.render(screen, snap, mode, { fade: false }), 15000);
  setInterval(() => WC.tick(screen, snap, mode), 1000);   // 타이머 숫자
  // 소리 있는 영상: 브라우저가 소리 재생을 막으면 소리 없이라도 재생하고 운영 화면에 알림
  // (TV 창을 한 번 누르거나 F 키로 전체화면을 하면 그 뒤로는 소리가 남)
  function checkSound() {
    setTimeout(() => {
      screen.querySelectorAll('video[data-sound]').forEach(v => {
        if (v._wcChecked) return; v._wcChecked = true;
        v.play().catch(() => { v.muted = true; v.play().catch(() => {}); try { wsNow?.send(JSON.stringify({ type: 'audioBlocked' })); } catch {} });
      });
    }, 400);
  }

  const fs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') fs(); });
  // 한 번 눌러 전체화면이 된 직후의 두 번째 누름(더블클릭)으로 다시 풀리지 않게
  let fsAt = 0; document.addEventListener('fullscreenchange', () => (fsAt = Date.now()));
  addEventListener('dblclick', () => { if (Date.now() - fsAt > 800) fs(); });
</script>
</body>
</html>
